function importData() {

    const data = BACKUP_DATA;

    if (data.transportData !== undefined) {

        if (data.transportData === null) {

        } else {

            localStorage.setItem(
                "transportData",

                    ? data.transportData
                    : JSON.stringify(data.transportData)
            );
